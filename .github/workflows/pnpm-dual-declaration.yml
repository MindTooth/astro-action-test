name: pnpm devEngines declaration precedence fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify conflicting declarations
        shell: bash
        working-directory: fixtures/pnpm-dual-declaration
        run: |
          test "$(node -p 'require(\"./package.json\").packageManager')" = pnpm@12.8.1
          test "$(node -p 'require(\"./package.json\").devEngines.packageManager.version')" = 12.8.2
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/pnpm-dual-declaration
          build-cmd: test "$(pnpm --version)" = 12.8.2 && pnpm run build
      - name: Verify lockfile selection and build
        shell: bash
        working-directory: fixtures/pnpm-dual-declaration
        run: |
          set -euo pipefail
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = true
          test "$(pnpm --config.pm-on-fail=ignore --version)" = 12.8.2
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          git diff --exit-code -- package.json pnpm-lock.yaml
