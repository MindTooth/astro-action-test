name: pnpm legacy packageManager fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/legacy-pnpm
          build-cmd: test "$(pnpm --version)" = 10.30.0 && pnpm run build
      - name: Verify legacy version selection and build
        shell: bash
        working-directory: fixtures/legacy-pnpm
        run: |
          set -euo pipefail
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = false
          test -z "$VERSION"
          test "$(pnpm --config.manage-package-manager-versions=false --version)" = 10.30.0
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          git diff --exit-code -- package.json pnpm-lock.yaml
