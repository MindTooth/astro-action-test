name: pnpm included lockfile directory fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify included lockfile layout
        shell: bash
        run: |
          test -f fixtures/workspace-included-lockfile-dir/config/lockfiles/pnpm-lock.yaml
          test ! -e fixtures/workspace-included-lockfile-dir/lockfiles/pnpm-lock.yaml
          test ! -e fixtures/workspace-included-lockfile-dir/pnpm-lock.yaml
          test ! -e fixtures/workspace-included-lockfile-dir/apps/site/pnpm-lock.yaml
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/workspace-included-lockfile-dir/apps/site
          package-manager: pnpm
          build-cmd: test "$(pnpm --version)" = 12.15.0 && pnpm run build
      - name: Verify included lockfile selection and build
        shell: bash
        working-directory: fixtures/workspace-included-lockfile-dir/apps/site
        run: |
          set -euo pipefail
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = true
          test "$(pnpm --config.pm-on-fail=ignore --version)" = 12.15.0
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          test -f ../../config/lockfiles/pnpm-lock.yaml
          test ! -e ../../lockfiles/pnpm-lock.yaml
          test ! -e ../../pnpm-lock.yaml
          test ! -e pnpm-lock.yaml
          git diff --exit-code -- ../../package.json ../../pnpm-workspace.yaml ../../config/paths.yaml ../../config/lockfiles/pnpm-lock.yaml package.json
