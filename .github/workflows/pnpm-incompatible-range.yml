name: pnpm incompatible locked version fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve expected version from npm
        id: registry
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(npm view 'pnpm@^12.15.0' version --json | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>{const v=JSON.parse(s);console.log(Array.isArray(v)?v[v.length-1]:v)})')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Verify incompatible lockfile
        working-directory: fixtures/incompatible-range
        shell: bash
        run: |
          test "$(node -p 'require("./package.json").devEngines.packageManager.version')" = '^12.15.0'
          head -n 12 pnpm-lock.yaml | grep -Fq 'version: 12.8.1'
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/incompatible-range
      - name: Verify registry selection and build
        working-directory: fixtures/incompatible-range
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.registry.outputs.version }}
        run: |
          set -euo pipefail
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = true
          test "$(pnpm --config.pm-on-fail=ignore --version)" = "$EXPECTED_VERSION"
          head -n 12 pnpm-lock.yaml | grep -Fq "version: $EXPECTED_VERSION"
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          git diff --exit-code -- package.json
