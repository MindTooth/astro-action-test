name: pnpm incompatible locked version fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify incompatible lockfile
        working-directory: fixtures/incompatible-range
        shell: bash
        run: |
          test "$(node -p 'require("./package.json").devEngines.packageManager.version')" = '^12.15.0'
          head -n 12 pnpm-lock.yaml | grep -Fq 'version: 12.8.1'
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/incompatible-range
      - name: Verify registry selection and build
        working-directory: fixtures/incompatible-range
        shell: bash
        run: |
          set -euo pipefail
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = true
          version=$(pnpm --config.pm-on-fail=ignore --version)
          node -e 'const m=process.argv[1].match(/^(\d+)\.(\d+)\.(\d+)$/); if (!m || +m[1] !== 12 || +m[2] < 15) process.exit(1)' "$version"
          test "$(cd "$RUNNER_TEMP" && npm view "pnpm@$version" version)" = "$version"
          head -n 12 pnpm-lock.yaml | grep -Fq "version: $version"
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          git diff --exit-code -- package.json
