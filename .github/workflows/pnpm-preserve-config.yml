name: pnpm preserve pm_on_fail configuration fixture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      pnpm_config_pm_on_fail: error
    steps:
      - uses: actions/checkout@v7
      - name: Build and upload fixture
        uses: MindTooth/action@feat/support_pnpm_lockfile
        with:
          path: fixtures/pnpm-preserve-config
          package-manager: pnpm
          build-cmd: test "$(pnpm config get pm-on-fail)" = error && pnpm run build
      - name: Verify legacy version selection and build
        shell: bash
        working-directory: fixtures/pnpm-preserve-config
        run: |
          set -euo pipefail
          test "$pnpm_config_pm_on_fail" = error
          test "$(cat .install-pm-on-fail)" = error
          test "$PACKAGE_MANAGER" = pnpm
          test "$PNPM_SETUP" = false
          test -z "$VERSION"
          test "$(pnpm --config.manage-package-manager-versions=false --version)" = 12.8.2
          test "$(node -p 'process.versions.node.split(".")[0]')" = 24
          test -f dist/index.html
          grep -q 'pnpm lockfile fixture' dist/index.html
          git diff --exit-code -- package.json pnpm-lock.yaml
